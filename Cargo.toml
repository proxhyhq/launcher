[package]
name = "proxhy-launcher"
version = "0.5.2"
edition = "2024"

[[bin]]
name = "proxhy-launcher"
path = "src/main.rs"

[dependencies]
dirs = "5"
eframe = "0.31"
egui = "0.31"
reqwest = { version = "0.12", features = ["blocking", "json"] }
self_update = {
  version = "0.41",
  features = [
    "archive-tar",
    "archive-zip",
    "compression-flate2",
    "compression-zip-deflate",
  ]
}
serde_json = "1"

[target."cfg(not(windows))".dependencies]
flate2 = "1"
tar = "0.4"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[target."cfg(windows)".dependencies]
windows-sys = {
  version = "0.61.2",
  features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading"
  ]
}
zip = "0.6"

[target."cfg(windows)".build-dependencies]
winres = "0.1"

[lints.clippy]
nursery = "warn"
pedantic = "warn"

[profile.release]
opt-level = 3
lto = true
